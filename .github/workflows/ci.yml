name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexustrack
          POSTGRES_PASSWORD: nexustrack
          POSTGRES_DB: nexustrack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexustrack" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://nexustrack:nexustrack@localhost:5432/nexustrack?schema=public
      DATABASE_URL_TEST: postgresql://nexustrack:nexustrack@localhost:5432/nexustrack_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-solo-para-pruebas
      JWT_REFRESH_SECRET: ci-refresh-secret-solo-para-pruebas
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Instalar dependencias
        run: |
          cp .env.example .env
          npm ci
          npm --prefix apps/web ci
      - name: Base de pruebas
        run: PGPASSWORD=nexustrack psql -h localhost -U nexustrack -d nexustrack -c 'CREATE DATABASE nexustrack_test'
      - name: Lint y formato
        run: |
          npm run lint
          npm run format:check
      - name: Pruebas unitarias
        run: npm test
      - name: Pruebas de integración de la API
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Pruebas de flujo (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:flujo
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API
        run: docker build -f apps/api/Dockerfile -t nexustrack-api .
      - name: Web
        run: docker build -f apps/web/Dockerfile -t nexustrack-web .
